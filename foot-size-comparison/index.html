<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <title>🦶脚的大小比较工具</title>
    <style>
        body { font-family: 'Helvetica Neue', Arial, sans-serif; text-align: center; background: #fdf6e3; padding: 10px; color: #333; margin: 0; }
        .container { max-width: 700px; margin: 20px auto; background: white; padding: 20px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        h1 { font-size: 1.5rem; margin-bottom: 10px; color: #444; }
        .description { font-size: 13px; color: #666; margin-bottom: 20px; line-height: 1.6; }
        
        .display-area { 
            position: relative; height: 500px; border: 2px solid #eee; margin-top: 20px; 
            display: flex; justify-content: center; align-items: flex-end; overflow: hidden; 
            background-color: #fff; border-radius: 10px;
        }

        #zoom-container {
            position: relative; width: 100%; height: 100%;
            display: flex; justify-content: center; align-items: flex-end;
            transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            transform-origin: bottom center;
        }
        
        .foot-wrapper { 
            position: absolute; 
            bottom: 40px; /* かかとの位置 */
            left: 50%; 
            transform: translateX(-50%); 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            transition: z-index 0.3s; 
        }

        .foot-svg-container { 
            transform-origin: bottom center; 
            transition: 0.5s cubic-bezier(0.4, 0, 0.2, 1); 
            will-change: transform; 
        }

        .label-tag { 
            position: absolute;
            bottom: 0;
            font-size: 14px; 
            font-weight: bold; 
            white-space: nowrap; 
            background: rgba(255,255,255,0.9); 
            padding: 4px 12px; 
            border-radius: 20px; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.1); 
            z-index: 10; 
            transition: 0.5s cubic-bezier(0.4, 0, 0.2, 1); 
        }

        .controls { display: flex; flex-direction: column; gap: 12px; }
        .input-group { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 8px; padding: 15px; border-radius: 12px; }
        .group-a { background: #fff0e0; border: 1px solid #ffe0c0; }
        .group-b { background: #e0f0ff; border: 1px solid #c0e0ff; }
        
        input, select { padding: 8px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
        .num-input { width: 65px; }
        .hint { font-size: 10px; color: #888; display: block; margin-bottom: 2px; }
        .color-picker { width: 35px; height: 35px; border: none; background: none; cursor: pointer; padding: 0; }
        .btn-front { padding: 6px 12px; cursor: pointer; border-radius: 20px; border: 1px solid #999; background: #fff; font-size: 12px; font-weight: bold; }
        .btn-front:hover { background: #f0f0f0; }

        .share-area { margin-top: 20px; border-top: 1px dashed #ccc; padding-top: 20px; }
        .btn-share { background: #000; color: #fff; border: none; padding: 10px 24px; border-radius: 25px; cursor: pointer; font-weight: bold; font-size: 14px; margin-bottom: 20px;}
        
        .other-tools-link {
            margin-bottom: 25px;
            padding: 15px;
            background: #f9f9f9;
            border-radius: 10px;
        }
        .other-tools-link a {
            text-decoration: none;
            color: #333;
            font-size: 14px;
            font-weight: bold;
            border: 2px solid #333;
            padding: 10px 20px;
            border-radius: 30px;
            display: inline-block;
            transition: 0.3s;
            margin: 5px;
        }
        .other-tools-link a:hover {
            background: #333;
            color: #fff;
        }

        .license-text { font-size: 10px; color: #aaa; line-height: 1.6; }
    </style>
</head>
<body>

<div class="container">
    <h1>🦶脚的大小比较工具</h1> 
    <p class="description">
        根据性别和身高推测并比较裸脚大小。<br>
        也可以输入实际的脚的大小进行比较。<br>
        <small>※默认值为日本各性别的平均值。因个体差异，数值仅供参考。<br>
        因按裸脚计算，显示结果会比平时穿的鞋码小。<br>
        （来源：参考产综研人体尺寸数据库等的推测值）</small>
    </p>

    <div class="controls">
        <div class="input-group group-a">
            <strong>A</strong>
            <input type="text" id="nameInputA" placeholder="名字A" oninput="update()">
            <select id="genderA" onchange="calcFromHeight('A')">
                <option value="male">男</option>
                <option value="female">女</option>
            </select>
            <div><span class="hint">身高(cm)</span><input type="number" id="heightA" class="num-input" value="171.5" oninput="calcFromHeight('A')"></div>
            <div style="border-left: 1px solid #ccc; padding-left: 8px;"><span class="hint">脚跟～脚尖(cm)※优先</span><input type="number" id="footA" class="num-input" value="25.2" step="0.1" oninput="calcFromFoot('A')"></div>
            <input type="color" id="colorA" class="color-picker" value="#ffcc99" oninput="update()">
            <button class="btn-front" onclick="bringToFront('A')">转到正面</button>
        </div>

        <div class="input-group group-b">
            <strong>B</strong>
            <input type="text" id="nameInputB" placeholder="名字B" oninput="update()">
            <select id="genderB" onchange="calcFromHeight('B')">
                <option value="male">男</option>
                <option value="female" selected>女</option>
            </select>
            <div><span class="hint">身高(cm)</span><input type="number" id="heightB" class="num-input" value="158.0" oninput="calcFromHeight('B')"></div>
            <div style="border-left: 1px solid #ccc; padding-left: 8px;"><span class="hint">脚跟～脚尖(cm)※优先</span><input type="number" id="footB" class="num-input" value="22.8" step="0.1" oninput="calcFromFoot('B')"></div>
            <input type="color" id="colorB" class="color-picker" value="#ffad60" oninput="update()">
            <button class="btn-front" onclick="bringToFront('B')">转到正面</button>
        </div>
    </div>
    
    <div class="display-area">
        <div id="zoom-container">
            <div id="wrapperA" class="foot-wrapper" style="z-index: 1;">
                <div id="labelA" class="label-tag"></div>
                <div class="foot-svg-container" id="svgContainerA">
                    <svg width="200" height="400" viewBox="0 0 640 1280" preserveAspectRatio="xMidYMid meet">
                        <g transform="translate(0,1280) scale(0.1,-0.1)">
                            <path id="shapeA" opacity="0.7" d="M1565 12779 c-99 -27 -219 -89 -296 -152 -120 -99 -220 -259 -259 -414 -25 -97 -45 -413 -36 -588 13 -292 78 -394 352 -558 309 -184 332 -180 620 107 257 257 271 290 260 616 -9 301 -39 510 -98 688 -57 174 -143 254 -322 302 -91 24 -129 24 -221 -1z M2763 12646 c-177 -57 -344 -266 -409 -511 -21 -82 -29 -263 -15 -355 33 -207 147 -391 291 -466 49 -25 66 -29 145 -29 82 0 96 3 157 33 140 69 259 238 314 448 23 85 27 121 28 254 1 184 -15 273 -75 397 -46 97 -119 177 -194 213 -60 30 -177 37 -242 16z M3718 12287 c-182 -69 -280 -224 -332 -527 -45 -266 -18 -528 61 -590 67 -53 286 -85 406 -60 111 23 166 101 231 326 74 259 68 493 -19 664 -33 66 -107 146 -159 172 -50 26 -140 33 -188 15z M4411 11572 c-133 -66 -253 -263 -290 -476 -25 -138 -5 -332 44 -425 60 -116 274 -121 442 -11 128 84 211 213 239 372 40 221 -47 463 -195 540 -74 39 -163 39 -240 0z M2498 10877 c-75 -32 -134 -67 -192 -115 -126 -104 -322 -159 -648 -182 -504 -35 -620 -153 -709 -720 -30 -190 -37 -542 -15 -700 62 -442 233 -784 594 -1184 106 -117 302 -303 452 -428 36 -30 148 -124 250 -208 241 -200 402 -343 470 -417 147 -159 266 -455 311 -773 17 -120 18 -471 1 -645 -67 -684 -181 -1099 -371 -1357 -57 -77 -117 -125 -228 -186 -255 -138 -803 -660 -1038 -988 -103 -143 -129 -214 -159 -429 -36 -255 -41 -362 -41 -805 1 -523 6 -564 93 -744 77 -157 446 -668 593 -821 96 -100 151 -131 275 -156 229 -46 534 0 764 116 534 268 915 957 1084 1960 62 365 84 658 96 1275 15 789 31 943 185 1875 177 1073 202 1189 297 1405 33 74 102 234 153 355 51 121 125 291 164 378 105 235 147 378 191 650 68 420 78 931 24 1196 -41 200 -181 355 -434 481 -160 80 -373 234 -573 416 -54 49 -124 111 -155 137 -201 171 -559 385 -852 510 -284 121 -465 153 -582 104z M5096 10889 c-114 -27 -255 -143 -306 -250 -53 -114 -65 -179 -65 -344 0 -127 4 -162 23 -230 41 -143 88 -185 214 -193 205 -13 405 139 494 374 44 118 27 242 -62 429 -79 168 -181 241 -298 214z" />
                        </g>
                    </svg>
                </div>
            </div>
            <div id="wrapperB" class="foot-wrapper" style="z-index: 2;">
                <div id="labelB" class="label-tag"></div>
                <div class="foot-svg-container" id="svgContainerB">
                    <svg width="200" height="400" viewBox="0 0 640 1280" preserveAspectRatio="xMidYMid meet">
                        <g transform="translate(0,1280) scale(0.1,-0.1)">
                            <path id="shapeB" opacity="0.7" d="M1565 12779 c-99 -27 -219 -89 -296 -152 -120 -99 -220 -259 -259 -414 -25 -97 -45 -413 -36 -588 13 -292 78 -394 352 -558 309 -184 332 -180 620 107 257 257 271 290 260 616 -9 301 -39 510 -98 688 -57 174 -143 254 -322 302 -91 24 -129 24 -221 -1z M2763 12646 c-177 -57 -344 -266 -409 -511 -21 -82 -29 -263 -15 -355 33 -207 147 -391 291 -466 49 -25 66 -29 145 -29 82 0 96 3 157 33 140 69 259 238 314 448 23 85 27 121 28 254 1 184 -15 273 -75 397 -46 97 -119 177 -194 213 -60 30 -177 37 -242 16z M3718 12287 c-182 -69 -280 -224 -332 -527 -45 -266 -18 -528 61 -590 67 -53 286 -85 406 -60 111 23 166 101 231 326 74 259 68 493 -19 664 -33 66 -107 146 -159 172 -50 26 -140 33 -188 15z M4411 11572 c-133 -66 -253 -263 -290 -476 -25 -138 -5 -332 44 -425 60 -116 274 -121 442 -11 128 84 211 213 239 372 40 221 -47 463 -195 540 -74 39 -163 39 -240 0z M2498 10877 c-75 -32 -134 -67 -192 -115 -126 -104 -322 -159 -648 -182 -504 -35 -620 -153 -709 -720 -30 -190 -37 -542 -15 -700 62 -442 233 -784 594 -1184 106 -117 302 -303 452 -428 36 -30 148 -124 250 -208 241 -200 402 -343 470 -417 147 -159 266 -455 311 -773 17 -120 18 -471 1 -645 -67 -684 -181 -1099 -371 -1357 -57 -77 -117 -125 -228 -186 -255 -138 -803 -660 -1038 -988 -103 -143 -129 -214 -159 -429 -36 -255 -41 -362 -41 -805 1 -523 6 -564 93 -744 77 -157 446 -668 593 -821 96 -100 151 -131 275 -156 229 -46 534 0 764 116 534 268 915 957 1084 1960 62 365 84 658 96 1275 15 789 31 943 185 1875 177 1073 202 1189 297 1405 33 74 102 234 153 355 51 121 125 291 164 378 105 235 147 378 191 650 68 420 78 931 24 1196 -41 200 -181 355 -434 481 -160 80 -373 234 -573 416 -54 49 -124 111 -155 137 -201 171 -559 385 -852 510 -284 121 -465 153 -582 104z M5096 10889 c-114 -27 -255 -143 -306 -250 -53 -114 -65 -179 -65 -344 0 -127 4 -162 23 -230 41 -143 88 -185 214 -193 205 -13 405 139 494 374 44 118 27 242 -62 429 -79 168 -181 241 -298 214z" />
                        </g>
                    </svg>
                </div>
            </div>
        </div>
    </div>

    <div class="share-area">
        <button class="btn-share" onclick="shareOnX()">分享到 𝕏</button>
        
        <div class="other-tools-link">
            <p style="font-size: 12px; color: #888; margin-bottom: 10px;">也来看看这些❣🤩</p>
            <a href="../">
                体格差模拟器一览
            </a>
        </div>

        <div class="license-text">
            截图投稿、加工、描图等请随意享用。<br>
            ※请勿用于营利或商业用途。
        </div>
    </div>
</div>

<script>
    function calcFromHeight(target) {
        const h = parseFloat(document.getElementById('height' + target).value);
        const gender = document.getElementById('gender' + target).value;
        if (!h) return;
        let result = (gender === 'male') ? (h * 0.145 + 0.3).toFixed(1) : (h * 0.141 + 0.5).toFixed(1);
        document.getElementById('foot' + target).value = result;
        update(); 
    }

    function calcFromFoot(target) {
        const foot = parseFloat(document.getElementById('foot' + target).value);
        const gender = document.getElementById('gender' + target).value;
        if (!foot) return;
        let height = (gender === 'male') ? ((foot - 0.3) / 0.145).toFixed(1) : ((foot - 0.5) / 0.141).toFixed(1);
        document.getElementById('height' + target).value = height;
        update();
    }
    
    function bringToFront(target) {
        document.getElementById('wrapperA').style.zIndex = (target === 'A') ? "10" : "1";
        document.getElementById('wrapperB').style.zIndex = (target === 'B') ? "10" : "1";
    }

    function update() {
        const nameA = document.getElementById('nameInputA').value || "名字A";
        const nameB = document.getElementById('nameInputB').value || "名字B";
        const footA = parseFloat(document.getElementById('footA').value) || 0;
        const footB = parseFloat(document.getElementById('footB').value) || 0;
        
        document.getElementById('labelA').innerText = `${nameA} (${footA}cm)`;
        document.getElementById('labelB').innerText = `${nameB} (${footB}cm)`;
        
        document.getElementById('shapeA').setAttribute('fill', document.getElementById('colorA').value);
        document.getElementById('shapeB').setAttribute('fill', document.getElementById('colorB').value);

        const baseSize = 25; 
        const scaleA = footA / baseSize;
        const scaleB = footB / baseSize;

        document.getElementById('svgContainerA').style.transform = `scale(${scaleA})`;
        document.getElementById('svgContainerB').style.transform = `scale(${scaleB})`;

        const labelPosA = (400 * scaleA);
        const labelPosB = (400 * scaleB);
        document.getElementById('labelA').style.bottom = `${labelPosA + 10}px`;
        document.getElementById('labelB').style.bottom = `${labelPosB + 10}px`;

        const maxFoot = Math.max(footA, footB);
        const zoomThreshold = 25; 
        let zoomScale = 1;
        
        if (maxFoot > zoomThreshold) {
            zoomScale = zoomThreshold / maxFoot;
        }
        document.getElementById('zoom-container').style.transform = `scale(${zoomScale})`;
    }

    function shareOnX() {
        const nameA = document.getElementById('nameInputA').value || "名字A";
        const nameB = document.getElementById('nameInputB').value || "名字B";
        const footA = document.getElementById('footA').value;
        const footB = document.getElementById('footB').value;
        const text = encodeURIComponent(`比较了${nameA}(${footA}cm)和${nameB}(${footB}cm)的脚的大小！\n#脚的大小比较工具\n`);
        const url = encodeURIComponent(window.location.href);
        window.open(`https://twitter.com/intent/tweet?text=${text}&url=${url}`, '_blank');
    }

    window.onload = update;
</script>
</body>
</html>
