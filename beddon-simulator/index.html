<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🛏️床咚模拟器</title>
    <style>
        :root { --panel-width: 300px; }
        body { margin: 0; font-family: 'Helvetica Neue', Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif; background: #ffffff; overflow: hidden; }
        
        /* 1. スマホ表示時の設定パネルスクロール・余白の最適化 */
        #ui-panel {
            position: absolute; 
            top: 10px; 
            left: 10px; 
            width: var(--panel-width);
            max-height: calc(100vh - 20px);
            max-height: calc(100dvh - 20px); /* 可変ビューポート対応 */
            background: rgba(255, 255, 255, 0.95); 
            padding: 15px; 
            padding-bottom: 40px; 
            border-radius: 15px; 
            z-index: 100; 
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            overflow-y: auto; 
            -webkit-overflow-scrolling: touch; 
            touch-action: pan-y; 
            border: 1px solid rgba(255,255,255,0.3); 
            backdrop-filter: blur(10px); 
            -webkit-backdrop-filter: blur(10px);
            box-sizing: border-box;
            transition: all 0.2s ease-out;
        }
        #canvas-container { width: 100vw; height: 100vh; cursor: move; touch-action: none; }

        @media screen and (max-width: 480px) { 
            :root { --panel-width: calc(100vw - 20px); }
            #ui-panel { left: 10px; right: 10px; }
        }
        
        @media screen and (orientation: landscape) and (max-height: 500px) {
            :root { --panel-width: 260px; }
            #ui-panel { top: 5px; left: 5px; padding: 10px; max-height: calc(100vh - 10px); }
            .app-title { font-size: 1.1rem; }
            .input-group { padding: 8px; margin-bottom: 5px; }
        }

        /* 2. パネル折りたたみ（「关闭」押下）時の背景枠固定の解消 */
        #ui-panel.collapsed {
            max-height: none !important;
            padding: 10px 15px !important;
            overflow: hidden !important;
            width: auto;
            max-width: calc(100vw - 20px);
        }

        @media screen and (max-width: 480px) { 
            /* スマホ表示で閉じた場合、右端の固定を解除してタイトルサイズへ収める */
            #ui-panel.collapsed { right: auto; }
        }

        /* ヘッダーをパネル上部に固定（スクロールしても上に張り付く） */
        .panel-header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            cursor: pointer; 
            user-select: none; 
            gap: 10px; 
            position: sticky; /* パネル内スクロール時も上に固定 */
            top: -15px;       /* padding 分を相殺 */
            background: rgba(255, 255, 255, 0.95);
            padding: 10px 0;
            margin: -15px -15px 10px -15px;
            padding-left: 15px;
            padding-right: 15px;
            z-index: 10;
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }

        #toggle-text { 
            font-size: 12px; 
            font-weight: bold; 
            color: #666; 
            background: #eee; 
            padding: 4px 10px; 
            border-radius: 10px; 
            white-space: nowrap; /* テキストの意図しない改行を防止 */
        }

        .app-title { 
            font-size: 1.2rem; 
            margin: 0; 
            color: #333; 
            font-weight: bold; 
            white-space: nowrap; /* タイトルの改行を防止 */
        }

        .collapsed #ui-content { display: none; }

        .app-description { font-size: 11px; color: #777; margin-top: 8px; margin-bottom: 5px; line-height: 1.5; text-align: center; }
        
        .app-disclaimer { 
            font-size: 9px; 
            color: #aaa; 
            margin-bottom: 12px; 
            line-height: 1.4; 
            text-align: left;
            background: #f9f9f9;
            padding: 8px;
            border-radius: 8px;
        }

        .input-group { display: flex; flex-direction: column; gap: 8px; padding: 12px; border-radius: 12px; margin-bottom: 10px; }
        .group-a { background: #fff5f0; border: 1px solid #ffe0d0; }
        .group-b { background: #f0f7ff; border: 1px solid #d0e7ff; }
        .section-header { display: flex; align-items: center; gap: 8px; margin-bottom: 3px; }
        .section-header strong { font-size: 15px; color: #444; }
        .input-row { display: flex; gap: 8px; align-items: flex-end; width: 100%; }
        .input-item { display: flex; flex-direction: column; flex: 1; min-width: 0; }
        .hint { font-size: 10px; color: #999; margin-bottom: 2px; font-weight: bold; }
        input, select { padding: 8px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; background: white; color: #333; width: 100%; box-sizing: border-box; }
        
        input[type="number"]::-webkit-outer-spin-button,
        input[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type="number"] { -moz-appearance: textfield; }

        .color-picker { width: 100%; height: 38px; border: 2px solid #999; border-radius: 4px; cursor: pointer; padding: 0; background: none; appearance: none; -webkit-appearance: none; }
        
        .switch-btn { width: 100%; padding: 12px; background: #333; color: white; border: none; border-radius: 25px; font-weight: bold; cursor: pointer; transition: 0.2s; font-size: 14px; -webkit-tap-highlight-color: transparent; margin-bottom: 10px; }
        .switch-btn:active { background: #000; transform: scale(0.98); }
        .swap-btn { margin-bottom: 5px; }

        .share-btn { 
            width: 100%; padding: 12px; background: #000; color: white; border: none; border-radius: 10px; 
            font-weight: bold; cursor: pointer; transition: 0.2s; font-size: 13px; 
            display: flex; align-items: center; justify-content: center; gap: 8px;
            text-decoration: none; margin-top: 10px;
        }
        .share-btn:active { transform: scale(0.98); opacity: 0.8; }

        .other-tools-link { margin-top: 20px; padding: 10px; background: #f9f9f9; border-radius: 10px; text-align: center; }
        .other-tools-link a { text-decoration: none; color: #333; font-size: 12px; font-weight: bold; border: 2px solid #333; padding: 8px 15px; border-radius: 30px; display: inline-block; transition: 0.3s; margin: 4px; }
        .other-tools-link a:hover { background: #333; color: #fff; }

        .usage-notes { font-size: 10px; color: #999; margin-top: 12px; line-height: 1.5; text-align: center; }

        .info-box { background: #ffffff; padding: 15px; border-radius: 12px; margin-top: 12px; border: 1px solid #eee; box-shadow: inset 0 2px 4px rgba(0,0,0,0.02); }
        .info-row { display: flex; justify-content: space-between; align-items: baseline; padding: 6px 0; }
        .info-row:not(:last-child) { border-bottom: 1px dashed #eee; margin-bottom: 4px; }
        .info-label { color: #555; font-size: 12px; font-weight: bold; display: flex; align-items: center; gap: 4px; }
        .info-value { font-weight: 800; font-size: 18px; color: #2c3e50; font-variant-numeric: tabular-nums; }
        .unit { font-size: 11px; margin-left: 3px; color: #7f8c8d; font-weight: normal; }
        
        /* 視点ラベルの位置調整 */
        #view-label { 
            position: absolute; 
            bottom: 20px; 
            right: 15px; 
            background: rgba(0,0,0,0.7); 
            color: white; 
            padding: 8px 16px; 
            border-radius: 20px; 
            font-size: 12px; 
            font-weight: bold; 
            z-index: 90; 
            pointer-events: none; 
        }

        .crosshair { position: absolute; top: 50%; left: 50%; width: 20px; height: 20px; border: 2px solid rgba(0,0,0,0.15); border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none; }
        
        input[type="range"] { width: 100%; margin: 5px 0; cursor: pointer; }
    </style>
</head>
<body>

<div id="ui-panel">
    <div class="panel-header" onclick="togglePanel()">
        <h1 class="app-title">🛏️床咚模拟器</h1>
        <span id="toggle-text">关闭</span>
    </div>

    <div id="ui-content">
        <p class="app-description">根据性别和身高模拟床咚场景。</p>
        
        <div class="input-group group-a">
            <div class="section-header"><strong>A（下方・躺在床上）</strong></div>
            <div class="input-row">
                <div class="input-item"><span class="hint">名字</span><input type="text" id="nameA" placeholder="名字A" oninput="updateScene()"></div>
                <div class="input-item" style="flex: 0.6;"><span class="hint">性别</span><select id="genderA" onchange="updateScene()"><option value="male">男</option><option value="female" selected>女</option></select></div>
            </div>
            <div class="input-row">
                <div class="input-item"><span class="hint">身高 (cm)</span><input type="number" id="heightA" value="158.0" step="0.1" oninput="updateScene()"></div>
                <div class="input-item" style="flex: 0.35;"><span class="hint">色</span><input type="color" id="colorA" class="color-picker" value="#ffcc99" oninput="updateScene()"></div>
            </div>
        </div>

        <div class="input-group group-b">
            <div class="section-header"><strong>B（上方・站立）</strong></div>
            <div class="input-row">
                <div class="input-item"><span class="hint">名字</span><input type="text" id="nameB" placeholder="名字B" oninput="updateScene()"></div>
                <div class="input-item" style="flex: 0.6;"><span class="hint">性别</span><select id="genderB" onchange="updateScene()"><option value="male" selected>男</option><option value="female">女</option></select></div>
            </div>
            <div class="input-row">
                <div class="input-item"><span class="hint">身高 (cm)</span><input type="number" id="heightB" value="171.5" step="0.1" oninput="updateScene()"></div>
                <div class="input-item" style="flex: 0.35;"><span class="hint">色</span><input type="color" id="colorB" class="color-picker" value="#ffad60" oninput="updateScene()"></div>
            </div>
            <div class="input-item" style="margin-top: 5px;">
                <span class="hint">手的位置（头侧 ↔ 脚侧）</span>
                <input type="range" id="armPos" min="-1.55" max="-1.2" step="0.01" value="-1.45" oninput="updateScene()">
            </div>
        </div>

        <div style="padding: 0 5px;">
            <button class="switch-btn swap-btn" onclick="swapAB()">⇄ 交换上下（A与B）</button>
            <button class="switch-btn" onclick="switchView()">🔄 切换视角</button>
        </div>
        
        <div id="info-container">
            <div class="info-box" id="info"></div>
            <button class="share-btn" onclick="shareToX()">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"></path></svg> 分享结果
            </button>
            <div class="other-tools-link">
                <p style="font-size: 10px; color: #888; margin-bottom: 8px;">也来看看这些❣🤩</p>
                <a href="../">体格差模拟器一览</a>
            </div>
            <div class="usage-notes">
                截图投稿、加工、描图等请随意享用。<br>
                ※请勿用于营利或商业用途。
            </div>
        </div>
    </div>
</div>

<div id="view-label">第三人称视角</div>
<div class="crosshair" id="crosshair" style="display:none;"></div>
<div id="canvas-container"></div>

<script type="module">
    import * as THREE from 'https://unpkg.com/three@0.158.0/build/three.module.js';

    let scene, camera, renderer, clock;
    let personA, personB, walkGroup, bedGroup;
    let currentView = '3rd';

    // ベッドの設定
    const BED_H = 0.55;  // ベッドの高さ(m)
    const BED_W = 1.6;   // ベッドの幅(m)  クイーンサイズ
    const BED_L = 2.0;   // ベッドの長さ(m) クイーンサイズ

    // 第三人称视角の初期アングル（イラストと同じ真横寄り）
    const DEFAULT_3RD = { x: 0.12, y: -Math.PI / 2 };
    let rotation = { x: DEFAULT_3RD.x, y: DEFAULT_3RD.y }, camDist = 3.6, isDragging = false, previousTouch = null, initialPinchDist = null;

    // 第三人称视角で見切れないようにするための注目点（マネキンとベッド全体の中心）
    let fitCenter = new THREE.Vector3();
    let fitBox = new THREE.Box3();
    const CAM_MAX_DIST = 40;

    function init() {
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0xffffff);
        camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.01, 1000);
        camera.rotation.order = 'YXZ';
        
        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        scene.add(new THREE.HemisphereLight(0xffffff, 0x888888, 2.5));
        scene.add(new THREE.GridHelper(200, 400, 0xeeeeee, 0xf5f5f5));

        walkGroup = new THREE.Group();
        scene.add(walkGroup);

        clock = new THREE.Clock();
        setupControls();

        // 入力フォームからフォーカスが外れた際に、パネルのスクロール位置を上部へリセットする
        document.querySelectorAll('#ui-panel input, #ui-panel select').forEach(element => {
            element.addEventListener('blur', () => {
                const panel = document.getElementById('ui-panel');
                if (panel) {
                    panel.scrollTop = 0;
                }
                // iOS Safari等の画面全体のズレ防止策
                window.scrollTo(0, 0);
            });
        });

        window.addEventListener('resize', onWindowResize);
        
        window.updateScene = updateScene;
        window.switchView = switchView;
        window.swapAB = swapAB;
        window.shareToX = shareToX;
        window.togglePanel = () => {
            const panel = document.getElementById('ui-panel');
            const text = document.getElementById('toggle-text');
            panel.classList.toggle('collapsed');
            text.innerText = panel.classList.contains('collapsed') ? '打开' : '关闭';
        };

        updateScene();
        animate();
    }

    function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
        fitCamera();
    }

    // マネキンとベッド全体が画面内に収まるように、注目点とカメラ距離を自動調整する
    function fitCamera() {
        if (!walkGroup || !personA || !personB || !bedGroup) return;
        walkGroup.updateMatrixWorld(true);

        const box = new THREE.Box3().setFromObject(walkGroup);
        if (box.isEmpty()) return;

        fitBox.copy(box);
        fitCenter = box.getCenter(new THREE.Vector3());

        // 現在の第三人称视角の向き（一人称視点中は初期アングルで計算）
        const rx = (currentView === '3rd') ? rotation.x : DEFAULT_3RD.x;
        const ry = (currentView === '3rd') ? rotation.y : DEFAULT_3RD.y;
        camDist = calcFitDist(rx, ry);
    }

    // 指定した向きから見て、マネキンとベッド全体が画面に収まる最小のカメラ距離
    // （これより近づくと見切れるので、拡大の限界として使う）
    function calcFitDist(rx, ry) {
        const box = fitBox;
        const dir = new THREE.Vector3(
            Math.sin(ry) * Math.cos(rx),
            Math.sin(rx),
            Math.cos(ry) * Math.cos(rx)
        ); // 注目点 → カメラ の向き
        const right = new THREE.Vector3().crossVectors(new THREE.Vector3(0, 1, 0), dir).normalize();
        const up = new THREE.Vector3().crossVectors(dir, right).normalize();

        const tanV = Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2);
        const tanH = tanV * camera.aspect;

        let need = 0;
        const p = new THREE.Vector3();
        for (let i = 0; i < 8; i++) {
            p.set(
                (i & 1) ? box.max.x : box.min.x,
                (i & 2) ? box.max.y : box.min.y,
                (i & 4) ? box.max.z : box.min.z
            ).sub(fitCenter);
            const d = Math.max(Math.abs(p.dot(right)) / tanH, Math.abs(p.dot(up)) / tanV) + p.dot(dir);
            if (d > need) need = d;
        }

        // 少し余白を持たせる
        return Math.max(1.0, Math.min(CAM_MAX_DIST, need * 1.12));
    }

    function swapAB() {
        const fields = ['name', 'gender', 'height', 'color'];
        fields.forEach(field => {
            const elA = document.getElementById(field + 'A');
            const elB = document.getElementById(field + 'B');
            const tmp = elA.value;
            elA.value = elB.value;
            elB.value = tmp;
        });
        updateScene();
    }

    function createMannequin(color, heightCm, gender, name, role) {
        const group = new THREE.Group();
        const h = heightCm * 0.01;
        const bodyMat = new THREE.MeshPhongMaterial({ color: color, transparent: true, opacity: 0.85 });
        const eyeMat = new THREE.MeshBasicMaterial({ color: 0x222222 });

        const headH = h * 0.13, neckH = h * 0.05, torsoH = h * 0.37, legH = h * 0.45;
        const eyeY = h * (gender === 'male' ? 0.904 : 0.903);
        const torsoW = (gender === 'male' ? 0.26 : 0.21) * (h/1.7);
        const torsoDepth = torsoW * 0.5;

        const headBox = new THREE.Group(); headBox.position.y = eyeY;
        const head = new THREE.Mesh(new THREE.SphereGeometry(headH * 0.8, 16, 16), bodyMat);
        head.position.y = (h - headH * 0.5) - eyeY; headBox.add(head);
        [-1, 1].forEach(side => {
            const eye = new THREE.Mesh(new THREE.SphereGeometry(headH * 0.12, 12, 12), eyeMat);
            eye.position.set(side * (headH * 0.28), 0, (headH * 0.7)); headBox.add(eye);
        });
        group.add(headBox);
        group.headParts = headBox;

        const neck = new THREE.Mesh(new THREE.CylinderGeometry(headH*0.3, headH*0.3, neckH, 16), bodyMat);
        neck.position.y = h - headH - (neckH * 0.5); group.add(neck);

        const torso = new THREE.Mesh(new THREE.BoxGeometry(torsoW, torsoH, torsoDepth), bodyMat);
        torso.position.y = legH + (torsoH * 0.5); group.add(torso);

        group.arms = [];
        [-1, 1].forEach(side => {
            const anchor = new THREE.Group();
            anchor.position.set(side * (torsoW * 0.6), legH + torsoH - (torsoW*0.15), 0);
            const armLen = h * 0.38;
            const mesh = new THREE.Mesh(new THREE.BoxGeometry(torsoW*0.3, armLen, torsoW*0.3), bodyMat);
            mesh.position.y = -armLen * 0.5; anchor.add(mesh); group.add(anchor); group.arms.push(anchor);
            
            if(role === 'A') {
                anchor.rotation.z = side * (10 * Math.PI / 180);
            }
        });

        group.legs = [];
        [-1, 1].forEach(side => {
            const hip = new THREE.Group();
            hip.position.set(side * (torsoW * 0.25), legH, 0);

            if (role === 'A') {
                const thighLen = legH * 0.5;
                const thigh = new THREE.Mesh(new THREE.BoxGeometry(torsoW*0.4, thighLen, torsoW*0.4), bodyMat);
                thigh.position.y = -thighLen * 0.5;
                hip.add(thigh);

                const knee = new THREE.Group();
                knee.position.set(0, -thighLen, 0);
                const calfLen = legH * 0.5;
                const calf = new THREE.Mesh(new THREE.BoxGeometry(torsoW*0.4, calfLen, torsoW*0.4), bodyMat);
                calf.position.y = -calfLen * 0.5;
                knee.add(calf);
                hip.add(knee);

                hip.rotation.z = side * (10 * Math.PI / 180);

                group.add(hip);
                group.legs.push({ hip: hip, knee: knee });
            } else {
                const mesh = new THREE.Mesh(new THREE.BoxGeometry(torsoW*0.4, legH, torsoW*0.4), bodyMat);
                mesh.position.y = -legH * 0.5; 
                hip.add(mesh); 
                group.add(hip); 
                group.legs.push(hip);
            }
        });

        const canvas = document.createElement('canvas'); canvas.width = 512; canvas.height = 128;
        const ctx = canvas.getContext('2d'); ctx.font = "bold 45px sans-serif"; ctx.fillStyle = "#333"; ctx.textAlign = "center";
        const displayName = name || (role === 'B' ? 'B' : 'A');
        ctx.fillText(`${displayName} (${heightCm.toFixed(1)}cm)`, 256, 64);
        const spriteMaterial = new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(canvas) });
        const sprite = new THREE.Sprite(spriteMaterial);
        sprite.scale.set(1.5, 0.38, 1); 
        sprite.position.y = h + 0.3; 
        group.add(sprite);
        group.nameTag = sprite;

        group.userData = { height: h, eyeY: eyeY, role: role, depth: torsoDepth, width: torsoW, legH: legH, armLen: h*0.38, torsoH: torsoH };

        if(role === 'A') {
            group.rotation.x = -Math.PI / 2;
            group.position.y = torsoDepth * 0.5;
            group.position.z = 0;
        } else {
            const quaternion = new THREE.Quaternion();
            quaternion.setFromAxisAngle(new THREE.Vector3(0, 1, 0), Math.PI);
            group.quaternion.multiply(quaternion);
        }

        return group;
    }

    function disposeGroup(g) {
        g.traverse(o => {
            if (o.geometry) o.geometry.dispose();
            if (o.material) o.material.dispose();
        });
    }

    function createBed() {
        const g = new THREE.Group();
        const frameH = BED_H - 0.25;
        const frame = new THREE.Mesh(
            new THREE.BoxGeometry(BED_W - 0.06, frameH, BED_L - 0.06),
            new THREE.MeshPhongMaterial({ color: 0xc9b08a })
        );
        frame.position.set(0, frameH / 2, -BED_L / 2);
        const mattress = new THREE.Mesh(
            new THREE.BoxGeometry(BED_W, 0.25, BED_L),
            new THREE.MeshPhongMaterial({ color: 0xe8edf5 })
        );
        mattress.position.set(0, BED_H - 0.125, -BED_L / 2);
        g.add(frame, mattress);

        // 枕をふたつ（頭側に並べる）
        const pillowMat = new THREE.MeshPhongMaterial({ color: 0xffffff });
        [-1, 1].forEach(side => {
            const pillow = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.14, 0.4), pillowMat);
            pillow.position.set(side * 0.4, BED_H + 0.07, -BED_L + 0.3);
            g.add(pillow);
        });
        return g;
    }

    // 名字タグを頭のすぐ上（ワールドの真上方向）に置く
    function raiseNameTag(person) {
        const top = new THREE.Vector3(0, person.userData.height, 0).applyQuaternion(person.quaternion).add(person.position);
        top.y += 0.35;
        const local = top.sub(person.position).applyQuaternion(person.quaternion.clone().invert());
        person.nameTag.position.copy(local);
    }

    // 頭（目）の現在のワールド位置
    function headEyeWorld(person) {
        return person.headParts.position.clone().applyQuaternion(person.quaternion).add(person.position);
    }

    // 首を支点に、お互いの目をまっすぐ見つめ合うように頭を向ける
    function aimHead(person, other) {
        const u = person.userData;
        const headH = u.height * 0.13;
        const neck = new THREE.Vector3(0, u.height - headH, 0);
        const eyeNeutral = new THREE.Vector3(0, u.eyeY, 0);
        const dirW = headEyeWorld(other).sub(headEyeWorld(person));
        if (dirW.lengthSq() < 1e-8) return;
        const dirL = dirW.normalize().applyQuaternion(person.quaternion.clone().invert());
        const m = new THREE.Matrix4().lookAt(new THREE.Vector3(), dirL.clone().negate(), new THREE.Vector3(0, 1, 0));
        const hq = new THREE.Quaternion().setFromRotationMatrix(m);
        person.headParts.quaternion.copy(hq);
        person.headParts.position.copy(neck).add(eyeNeutral.clone().sub(neck).applyQuaternion(hq));
    }

    function updateScene() {
        const hA = parseFloat(document.getElementById('heightA').value)||158, hB = parseFloat(document.getElementById('heightB').value)||171.5;
        const armSlider = parseFloat(document.getElementById('armPos').value) || -1.45;

        if(personA) walkGroup.remove(personA); if(personB) walkGroup.remove(personB);
        if(bedGroup) { walkGroup.remove(bedGroup); disposeGroup(bedGroup); }
        
        personA = createMannequin(document.getElementById('colorA').value, hA, document.getElementById('genderA').value, document.getElementById('nameA').value, 'A');
        personB = createMannequin(document.getElementById('colorB').value, hB, document.getElementById('genderB').value, document.getElementById('nameB').value, 'B');

        const uA = personA.userData, uB = personB.userData;

        // ===== A：ベッドの奥寄りに仰向け。膝がベッドの足側の縁に来て、膝から下を縁の外へ垂らす =====
        const KNEE_OVER = 0.08;                         // 膝がベッドの縁(z:0)より外に出る量
        const yThigh = BED_H + uA.depth * 0.5;          // マットレスの上に背中をつけた高さ
        const thighA = uA.legH * 0.5;
        const legSplayA = 10 * Math.PI / 180;
        const kneeZ = KNEE_OVER;
        const hipZ = kneeZ - thighA * Math.cos(legSplayA);
        personA.position.set(0, yThigh, hipZ + uA.legH);

        personA.legs.forEach((leg, i) => {
            const phi = (i === 0 ? -1 : 1) * legSplayA;
            leg.hip.rotation.set(0, 0, phi);            // 太ももはベッドの上でまっすぐ
            // ふくらはぎは真下（ワールドの鉛直方向）へ
            leg.knee.quaternion.setFromUnitVectors(new THREE.Vector3(0, -1, 0), new THREE.Vector3(0, 0, -1));
        });

        // ===== B：Aのふくらはぎの外側に立ち、上体を前に倒して双手をベッドにつく =====
        const legHB = uB.legH;
        const sB = uB.torsoH - uB.width * 0.15;          // 腰(股関節)から肩までの長さ
        const armSplay = 0.15;
        const LB = uB.armLen * Math.cos(armSplay);       // 腕の長さ（横への開きを考慮）
        const zf = kneeZ + uA.width * 0.2 + uB.width * 0.2 + 0.03;   // Bの足の位置（Aのふくらはぎの外側）

        // 手をつく位置：スライダーで Aの肩のすぐ下(頭側) ↔ お腹あたり(足側)
        const uSl = Math.min(1, Math.max(0, (armSlider + 1.55) / 0.35));
        const zShoulderA = personA.position.z - (uA.legH + uA.torsoH - uA.width * 0.15);
        const zh = zShoulderA + uA.height * (0.06 + 0.22 * uSl);
        const yh = BED_H + 0.02;

        // Bの股関節から手までのベクトル（前方=頭側 を f とする）
        let fv = zf - zh;
        const dy = yh - legHB;
        const dMax = (sB + LB) * 0.999;
        if (fv * fv + dy * dy > dMax * dMax) fv = Math.sqrt(Math.max(0, dMax * dMax - dy * dy));  // 届かない時は目一杯まで
        const D = Math.max(0.01, Math.sqrt(fv * fv + dy * dy));
        const cosA = Math.max(-1, Math.min(1, (D * D + sB * sB - LB * LB) / (2 * sB * D)));
        let alpha = Math.atan2(fv, dy) - Math.acos(cosA);           // 上体の前傾角（鉛直から）
        alpha = Math.max(0.05, Math.min(1.5, alpha));
        const armF = fv - sB * Math.sin(alpha);
        const armY = dy - sB * Math.cos(alpha);
        const beta = Math.atan2(-armF, -armY);                      // 腕の角度（鉛直から）

        const qY = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), Math.PI);
        const qX = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1, 0, 0), -alpha);
        personB.quaternion.copy(qX.multiply(qY));
        personB.position.set(0, legHB - legHB * Math.cos(alpha), zf + legHB * Math.sin(alpha));

        personB.arms.forEach((arm, i) => {
            arm.rotation.x = beta - alpha;
            arm.rotation.z = (i === 0 ? -1 : 1) * armSplay;
        });

        personB.legs.forEach((hip, i) => {
            hip.rotation.x = -alpha;                                // 脚は床に対して垂直に立てる
            hip.rotation.z = (i === 0 ? -1 : 1) * 0.08;
        });

        // ===== お互いの目を見つめ合う（首を支点に数回補正して収束させる） =====
        for (let k = 0; k < 4; k++) {
            aimHead(personA, personB);
            aimHead(personB, personA);
        }

        // ===== ベッド（クイーンサイズ）：足側の縁が z:0 =====
        bedGroup = createBed();

        raiseNameTag(personA);
        raiseNameTag(personB);

        walkGroup.add(bedGroup, personA, personB);

        const nA = document.getElementById('nameA').value || 'A';
        const nB = document.getElementById('nameB').value || 'B';
        const nA_clean = nA.trim() !== '' ? nA : 'A';
        const nB_clean = nB.trim() !== '' ? nB : 'B';

        if(currentView !== '3rd') {
            const myName = (currentView === 'A') ? nA_clean : nB_clean;
            document.getElementById('view-label').innerText = `${myName} 的视角`;
            if(currentView === 'A') { personA.headParts.visible = false; personA.nameTag.visible = false; }
            if(currentView === 'B') { personB.headParts.visible = false; personB.nameTag.visible = false; }
        }

        document.getElementById('info').innerHTML = `
            <div class="info-row"><span class="info-label">📏 身高差</span><span class="info-value">${Math.abs(hA-hB).toFixed(1)}<span class="unit">cm</span></span></div>
        `;

        // 第三人称视角で見切れないようにカメラを自動調整
        fitCamera();
    }

    function animate() {
        requestAnimationFrame(animate);
        
        // ふたりの胴体の中心を計算（世界座標ベース）
        const torsoAWorldPos = new THREE.Vector3(0, personA.userData.legH + personA.userData.torsoH * 0.5, 0).applyMatrix4(personA.matrixWorld);
        const torsoBWorldPos = new THREE.Vector3(0, personB.userData.legH + personB.userData.torsoH * 0.5, 0).applyMatrix4(personB.matrixWorld);
        const centerPos = new THREE.Vector3().addVectors(torsoAWorldPos, torsoBWorldPos).multiplyScalar(0.5);

        if (currentView === '3rd') {
            rotation.x = Math.max(-Math.PI * 0.499, Math.min(Math.PI * 0.499, rotation.x));
            camera.up.set(0, 1, 0);
            // 引いている時はマネキンとベッド全体の中心、拡大するほどマネキンの中心へ注目点を寄せる（ズーム制限无）
            const fitD = calcFitDist(rotation.x, rotation.y);
            const t = Math.max(0, Math.min(1, (fitD - camDist) / (fitD * 0.6)));
            const focus = fitCenter.clone().lerp(centerPos, t);
            camera.position.set(
                focus.x + Math.sin(rotation.y) * Math.cos(rotation.x) * camDist, 
                focus.y + Math.sin(rotation.x) * camDist, 
                focus.z + Math.cos(rotation.y) * Math.cos(rotation.x) * camDist
            );
            camera.lookAt(focus);
        } else {
            const self = (currentView === 'A' ? personA : personB);
            const other = (currentView === 'A' ? personB : personA);
            
            const upVec = new THREE.Vector3(0, 1, 0).applyQuaternion(self.quaternion);
            camera.up.copy(upVec);

            const eyePos = new THREE.Vector3(0, 0, 0.1).applyQuaternion(self.headParts.quaternion).add(self.headParts.position);
            eyePos.applyQuaternion(self.quaternion);
            camera.position.copy(self.position).add(eyePos);
            
            const targetEyePos = other.headParts.position.clone().applyQuaternion(other.quaternion).add(other.position);
            camera.lookAt(targetEyePos);
            
            camera.rotateX(rotation.x);
            camera.rotateY(rotation.y);
        }
        renderer.render(scene, camera);
    }

    function setupControls() {
        const c = document.getElementById('canvas-container');
        const move = (dx, dy) => {
            rotation.y -= dx * 0.005; rotation.x -= dy * 0.005;
        };

        c.addEventListener('mousedown', () => isDragging = true);
        window.addEventListener('mouseup', () => isDragging = false);
        window.addEventListener('mousemove', e => { if(isDragging) move(e.movementX, e.movementY); });

        c.addEventListener('wheel', e => {
            if (currentView === '3rd') {
                camDist += e.deltaY * 0.002;
                camDist = Math.max(0.5, Math.min(CAM_MAX_DIST, camDist));
            }
        }, { passive: true });

        c.addEventListener('touchstart', e => {
            if (e.touches.length === 1) {
                isDragging = true;
                previousTouch = e.touches[0];
                initialPinchDist = null;
            } else if (e.touches.length === 2 && currentView === '3rd') {
                isDragging = false;
                initialPinchDist = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
            }
        }, { passive: false });

        window.addEventListener('touchend', () => { 
            isDragging = false; 
            initialPinchDist = null;
        });

        window.addEventListener('touchmove', e => {
            if (e.touches.length === 1 && isDragging && previousTouch) {
                if (e.cancelable) e.preventDefault(); 
                const touch = e.touches[0];
                move(touch.clientX - previousTouch.clientX, touch.clientY - previousTouch.clientY);
                previousTouch = touch;
            } else if (e.touches.length === 2 && initialPinchDist !== null && currentView === '3rd') {
                if (e.cancelable) e.preventDefault();
                const currentDist = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
                const diff = currentDist - initialPinchDist;
                camDist -= diff * 0.005;
                camDist = Math.max(0.5, Math.min(CAM_MAX_DIST, camDist));
                initialPinchDist = currentDist;
            }
        }, { passive: false });
    }

    function switchView() {
        const order = ['3rd', 'A', 'B']; 
        currentView = order[(order.indexOf(currentView) + 1) % 3];
        
        const nA = document.getElementById('nameA').value || 'A';
        const nB = document.getElementById('nameB').value || 'B';
        const nA_clean = nA.trim() !== '' ? nA : 'A';
        const nB_clean = nB.trim() !== '' ? nB : 'B';
        const myName = (currentView === 'A') ? nA_clean : nB_clean;

        if (currentView === '3rd') {
            document.getElementById('view-label').innerText = '第三人称视角';
        } else {
            document.getElementById('view-label').innerText = `${myName} 的视角`;
        }

        document.getElementById('crosshair').style.display = currentView === '3rd' ? 'none' : 'block';
        
        personA.headParts.visible = true; personA.nameTag.visible = true;
        personB.headParts.visible = true; personB.nameTag.visible = true;
        
        if (currentView === 'A') {
            personA.headParts.visible = false;
            personA.nameTag.visible = false;
        } else if (currentView === 'B') {
            personB.headParts.visible = false;
            personB.nameTag.visible = false;
        }
        
        if (currentView === '3rd') {
            rotation.x = DEFAULT_3RD.x;
            rotation.y = DEFAULT_3RD.y;
            fitCamera(); // 三人称に戻った時も見切れないように距離を再調整
        } else {
            rotation.x = 0;
            rotation.y = 0;
        }
    }

    function shareToX() {
        const nA = document.getElementById('nameA').value || 'A';
        const nB = document.getElementById('nameB').value || 'B';
        const hA = parseFloat(document.getElementById('heightA').value) || 158.0;
        const hB = parseFloat(document.getElementById('heightB').value) || 171.5;
        const text = `${nB}(${hB.toFixed(1)}cm)向${nA}(${hA.toFixed(1)}cm)床咚！\n#床咚模拟器\n`;
        window.open(`https://twitter.com/intent/tweet?text=${encodeURIComponent(text)}&url=${encodeURIComponent(window.location.href)}`, '_blank');
    }

    init();
</script>
