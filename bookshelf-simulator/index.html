<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>📚书架模拟器</title>
    <style>
        :root { --panel-width: 300px; }
        body { margin: 0; font-family: 'Helvetica Neue', Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif; background: #ffffff; overflow: hidden; }
        
        /* #ui-panel の更新 */
        #ui-panel {
            position: absolute; 
            top: 10px; 
            left: 10px; 
            width: var(--panel-width);
            max-height: calc(100vh - 20px);
            max-height: calc(100dvh - 20px); /* 可変ビューポート対応 */
            background: rgba(255, 255, 255, 0.95); 
            padding: 15px; 
            padding-bottom: 40px; 
            border-radius: 15px; 
            z-index: 100; 
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            overflow-y: auto; 
            -webkit-overflow-scrolling: touch; 
            touch-action: pan-y; 
            border: 1px solid rgba(255,255,255,0.3); 
            backdrop-filter: blur(10px); 
            -webkit-backdrop-filter: blur(10px);
            box-sizing: border-box;
            transition: all 0.2s ease-out;
        }
        
        #canvas-container { width: 100vw; height: 100vh; cursor: move; touch-action: none; }

        @media screen and (max-width: 480px) { 
            :root { --panel-width: calc(100vw - 20px); }
            #ui-panel { left: 10px; right: 10px; }
        }
        
        @media screen and (orientation: landscape) and (max-height: 500px) {
            :root { --panel-width: 260px; }
            #ui-panel { top: 5px; left: 5px; padding: 10px; max-height: calc(100vh - 10px); }
            .app-title { font-size: 1.1rem; }
            .input-group { padding: 8px; margin-bottom: 5px; }
        }

        #ui-panel.collapsed {
            max-height: none !important;
            padding: 10px 15px !important;
            overflow: hidden !important;
            width: auto;
            max-width: calc(100vw - 20px);
        }

        @media screen and (max-width: 480px) { 
            #ui-panel.collapsed { right: auto; }
        }

        /* ヘッダーをパネル上部に固定（スクロールしても上に張り付く） */
        .panel-header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            cursor: pointer; 
            user-select: none; 
            gap: 10px; 
            position: sticky; /* パネル内スクロール時も上に固定 */
            top: -15px;       /* padding 分を相殺 */
            background: rgba(255, 255, 255, 0.95);
            padding: 10px 0;
            margin: -15px -15px 10px -15px;
            padding-left: 15px;
            padding-right: 15px;
            z-index: 10;
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }

        #toggle-text { 
            font-size: 12px; 
            font-weight: bold; 
            color: #666; 
            background: #eee; 
            padding: 4px 10px; 
            border-radius: 10px; 
            white-space: nowrap; 
        }

        .collapsed #ui-content { display: none; }

        .app-title { 
            font-size: 1.2rem; 
            margin: 0; 
            color: #333; 
            font-weight: bold; 
            white-space: nowrap; 
        }

        .app-description { font-size: 11px; color: #777; margin-top: 8px; margin-bottom: 5px; line-height: 1.5; text-align: center; }

        .input-group { display: flex; flex-direction: column; gap: 8px; padding: 12px; border-radius: 12px; margin-bottom: 10px; }
        .group-a { background: #fff5f0; border: 1px solid #ffe0d0; }
        .group-b { background: #f0f7ff; border: 1px solid #d0e7ff; }
        .section-header { display: flex; align-items: center; gap: 8px; margin-bottom: 3px; }
        .section-header strong { font-size: 15px; color: #444; }
        .input-row { display: flex; gap: 8px; align-items: flex-end; width: 100%; }
        .input-item { display: flex; flex-direction: column; flex: 1; min-width: 0; }
        .hint { font-size: 10px; color: #999; margin-bottom: 2px; font-weight: bold; }
        input, select { padding: 8px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; background: white; color: #333; width: 100%; box-sizing: border-box; }
        
        input[type="number"]::-webkit-outer-spin-button,
        input[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type="number"] { -moz-appearance: textfield; }

        .color-picker { width: 100%; height: 38px; border: 2px solid #999; border-radius: 4px; cursor: pointer; padding: 0; background: none; appearance: none; -webkit-appearance: none; }
        
        .switch-btn { width: 100%; padding: 12px; background: #333; color: white; border: none; border-radius: 25px; font-weight: bold; cursor: pointer; transition: 0.2s; font-size: 14px; -webkit-tap-highlight-color: transparent; margin-bottom: 10px; }
        .switch-btn:active { background: #000; transform: scale(0.98); }
        .swap-btn { margin-bottom: 5px; }

        .share-btn { 
            width: 100%; padding: 12px; background: #000; color: white; border: none; border-radius: 10px; 
            font-weight: bold; cursor: pointer; transition: 0.2s; font-size: 13px; 
            display: flex; align-items: center; justify-content: center; gap: 8px;
            text-decoration: none; margin-top: 10px;
        }
        .share-btn:active { transform: scale(0.98); opacity: 0.8; }

        .other-tools-link { margin-top: 20px; padding: 10px; background: #f9f9f9; border-radius: 10px; text-align: center; }
        .other-tools-link a { text-decoration: none; color: #333; font-size: 12px; font-weight: bold; border: 2px solid #333; padding: 8px 15px; border-radius: 30px; display: inline-block; transition: 0.3s; margin: 4px; }
        .other-tools-link a:hover { background: #333; color: #fff; }

        .usage-notes { font-size: 10px; color: #999; margin-top: 12px; line-height: 1.5; text-align: center; }

        .info-box { background: #ffffff; padding: 15px; border-radius: 12px; margin-top: 12px; border: 1px solid #eee; box-shadow: inset 0 2px 4px rgba(0,0,0,0.02); }
        .info-row { display: flex; justify-content: space-between; align-items: baseline; padding: 6px 0; }
        .info-row:not(:last-child) { border-bottom: 1px dashed #eee; margin-bottom: 4px; }
        .info-label { color: #555; font-size: 12px; font-weight: bold; display: flex; align-items: center; gap: 4px; }
        .info-value { font-weight: 800; font-size: 18px; color: #2c3e50; font-variant-numeric: tabular-nums; }
        .unit { font-size: 11px; margin-left: 3px; color: #7f8c8d; font-weight: normal; }
        
        #view-label { 
            position: absolute; 
            bottom: 20px; 
            right: 15px; 
            background: rgba(0,0,0,0.7); 
            color: white; 
            padding: 8px 16px; 
            border-radius: 20px; 
            font-size: 12px; 
            font-weight: bold; 
            z-index: 90; 
            pointer-events: none; 
        }

        .crosshair { position: absolute; top: 50%; left: 50%; width: 20px; height: 20px; border: 2px solid rgba(0,0,0,0.15); border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none; }

        .anim-controls {
            display: flex;
            gap: 5px;
            width: 100%;
            background: #eee;
            padding: 3px;
            border-radius: 8px;
            box-sizing: border-box;
        }
        .btn-anim {
            flex: 1;
            padding: 8px 5px;
            font-size: 12px;
            font-weight: bold;
            border: none;
            background: transparent;
            color: #666;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.15s ease;
            outline: none;
            text-align: center;
            -webkit-tap-highlight-color: transparent;
        }
        .btn-anim:active {
            background: #ccc !important;
            color: #333 !important;
            box-shadow: none !important;
        }
        .btn-anim.active {
            background: #ffffff;
            color: #333;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
        }
    </style>
</head>
<body>

<div id="ui-panel">
    <div class="panel-header" onclick="togglePanel()">
        <h1 class="app-title">📚书架模拟器</h1>
        <span id="toggle-text">关闭</span>
    </div>

    <div id="ui-content">
        <p class="app-description">模拟书架场景。</p>
        
        <div class="input-group group-a">
            <div class="section-header"><strong>A（够不到书的一方）</strong></div>
            <div class="input-row">
                <div class="input-item"><span class="hint">名字</span><input type="text" id="nameA" placeholder="名字A" oninput="updateScene()"></div>
                <div class="input-item" style="flex: 0.6;"><span class="hint">性别</span><select id="genderA" onchange="updateScene()"><option value="male">男</option><option value="female" selected>女</option></select></div>
            </div>
            <div class="input-row">
                <div class="input-item"><span class="hint">身高 (cm)</span><input type="number" id="heightA" value="158.0" step="0.1" oninput="updateScene()"></div>
                <div class="input-item" style="flex: 0.35;"><span class="hint">色</span><input type="color" id="colorA" class="color-picker" value="#ffcc99" oninput="updateScene()"></div>
            </div>
        </div>

        <div class="input-group group-b">
            <div class="section-header"><strong>B（帮忙拿书的一方）</strong></div>
            <div class="input-row">
                <div class="input-item"><span class="hint">名字</span><input type="text" id="nameB" placeholder="名字B" oninput="updateScene()"></div>
                <div class="input-item" style="flex: 0.6;"><span class="hint">性别</span><select id="genderB" onchange="updateScene()"><option value="male" selected>男</option><option value="female">女</option></select></div>
            </div>
            <div class="input-row">
                <div class="input-item"><span class="hint">身高 (cm)</span><input type="number" id="heightB" value="171.5" step="0.1" oninput="updateScene()"></div>
                <div class="input-item" style="flex: 0.35;"><span class="hint">色</span><input type="color" id="colorB" class="color-picker" value="#ffad60" oninput="updateScene()"></div>
            </div>
            <div class="input-item" style="margin-top: 5px;">
                <span class="hint">使用的手</span>
                <div class="anim-controls">
                    <button id="btn-arm-left" class="btn-anim" onclick="setArmType('left')">左手</button>
                    <button id="btn-arm-right" class="btn-anim active" onclick="setArmType('right')">右手</button>
                </div>
            </div>
        </div>

        <div style="padding: 0 5px;">
            <button class="switch-btn swap-btn" onclick="swapAB()">⇄ 交换角色（A与B）</button>
            <button class="switch-btn" onclick="switchView()">🔄 切换视角</button>
        </div>
        
        <div id="info-container">
            <div class="info-box" id="info"></div>
            <button class="share-btn" onclick="shareToX()">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"></path></svg> 分享结果
            </button>
            <div class="other-tools-link">
                <p style="font-size: 10px; color: #888; margin-bottom: 8px;">也来看看这些❣🤩</p>
                <a href="../">体格差模拟器一览</a>
            </div>
            <div class="usage-notes">
                截图投稿、加工、描图等请随意享用。<br>
                ※请勿用于营利或商业用途。
            </div>
        </div>
    </div>
</div>

<div id="view-label">第三人称视角</div>
<div class="crosshair" id="crosshair" style="display:none;"></div>
<div id="canvas-container"></div>

<script type="module">
    import * as THREE from 'https://unpkg.com/three@0.158.0/build/three.module.js';

    let scene, camera, renderer;
    let personA, personB, walkGroup, bookshelfGroup;
    let targetTargetPos = new THREE.Vector3();
    let currentView = '3rd';
    let rotation = { x: 0, y: 0 }, camDist = 2.8, isDragging = false, previousTouch = null;
    let currentArmType = 'right';

    const TOP_SHELF_HEIGHT = 2.08;

    function init() {
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0xffffff);
        camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.01, 1000);
        camera.rotation.order = 'YXZ';
        
        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        scene.add(new THREE.HemisphereLight(0xffffff, 0x888888, 2.5));
        scene.add(new THREE.GridHelper(200, 400, 0xeeeeee, 0xf5f5f5));

        bookshelfGroup = new THREE.Group();
        const shelfMat = new THREE.MeshPhongMaterial({ color: 0x5c3a21 });
        const shelfHeight = 2.2;
        const shelfWidth = 1.8;
        const shelfDepth = 0.3;
        const boardThick = 0.03;
        const numShelves = 8;
        const stepY = (shelfHeight - boardThick) / (numShelves - 1);

        const sideGeom = new THREE.BoxGeometry(boardThick, shelfHeight, shelfDepth);
        const leftSide = new THREE.Mesh(sideGeom, shelfMat);
        leftSide.position.set(-shelfWidth/2, shelfHeight/2, -shelfDepth/2);
        const rightSide = new THREE.Mesh(sideGeom, shelfMat);
        rightSide.position.set(shelfWidth/2, shelfHeight/2, -shelfDepth/2);
        
        const topBoard = new THREE.Mesh(new THREE.BoxGeometry(shelfWidth, boardThick, shelfDepth), shelfMat);
        topBoard.position.set(0, shelfHeight - boardThick/2, -shelfDepth/2);
        const bottomBoard = new THREE.Mesh(new THREE.BoxGeometry(shelfWidth, boardThick, shelfDepth), shelfMat);
        bottomBoard.position.set(0, boardThick/2, -shelfDepth/2);

        const backBoard = new THREE.Mesh(new THREE.BoxGeometry(shelfWidth, shelfHeight, 0.01), shelfMat);
        backBoard.position.set(0, shelfHeight/2, -shelfDepth + 0.005);

        bookshelfGroup.add(leftSide, rightSide, topBoard, bottomBoard, backBoard);

        const bookColors = [0x2266aa, 0xaa3333, 0x338833, 0xddaa33, 0x663399, 0x444444, 0xcc6622];
        const shelfBoardGeom = new THREE.BoxGeometry(shelfWidth - boardThick*2, boardThick, shelfDepth - 0.02);

        for (let i = 0; i < numShelves; i++) {
            const shelfY = boardThick/2 + i * stepY;
            
            if (i > 0 && i < numShelves - 1) {
                const shelfBoard = new THREE.Mesh(shelfBoardGeom, shelfMat);
                shelfBoard.position.set(0, shelfY, -shelfDepth/2);
                bookshelfGroup.add(shelfBoard);
            }

            if (i < numShelves - 1) {
                const currentShelfTop = shelfY + boardThick/2;
                let currentX = -shelfWidth/2 + boardThick + 0.05;

                while (currentX < shelfWidth/2 - boardThick - 0.08) {
                    const bookW = 0.03 + Math.random() * 0.02;
                    const bookH = stepY * 0.65 + Math.random() * (stepY * 0.15);
                    const bookD = shelfDepth * 0.7;
                    const color = bookColors[Math.floor(Math.random() * bookColors.length)];

                    const bookMesh = new THREE.Mesh(
                        new THREE.BoxGeometry(bookW, bookH, bookD),
                        new THREE.MeshPhongMaterial({ color: color })
                    );
                    bookMesh.position.set(currentX + bookW/2, currentShelfTop + bookH/2, -shelfDepth + bookD/2 + 0.02);
                    bookshelfGroup.add(bookMesh);

                    currentX += bookW + 0.005;
                }
            }
        }

        scene.add(bookshelfGroup);

        walkGroup = new THREE.Group();
        scene.add(walkGroup);

        setupControls();

        window.addEventListener('resize', onWindowResize);
        
        window.updateScene = updateScene;
        window.switchView = switchView;
        window.swapAB = swapAB;
        window.shareToX = shareToX;
        window.setArmType = setArmType;
        window.togglePanel = () => {
            const panel = document.getElementById('ui-panel');
            const text = document.getElementById('toggle-text');
            panel.classList.toggle('collapsed');
            text.innerText = panel.classList.contains('collapsed') ? '打开' : '关闭';
        };

        updateScene();
        animate();
    }

    function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function swapAB() {
        const fields = ['name', 'gender', 'height', 'color'];
        fields.forEach(field => {
            const elA = document.getElementById(field + 'A');
            const elB = document.getElementById(field + 'B');
            const tmp = elA.value;
            elA.value = elB.value;
            elB.value = tmp;
        });
        updateScene();
    }

    function setArmType(type) {
        currentArmType = type;
        
        const armTypes = ['right', 'left'];
        armTypes.forEach(t => {
            const btn = document.getElementById(`btn-arm-${t}`);
            if (btn) {
                if (t === type) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            }
        });
        
        updateScene();
    }

    function createMannequin(color, heightCm, gender, name, role) {
        const group = new THREE.Group();
        const h = heightCm * 0.01;
        const bodyMat = new THREE.MeshPhongMaterial({ color: color, transparent: true, opacity: 0.85 });
        const eyeMat = new THREE.MeshBasicMaterial({ color: 0x222222 });

        const headH = h * 0.13, neckH = h * 0.05, torsoH = h * 0.37, legH = h * 0.45;
        const eyeY = h * (gender === 'male' ? 0.904 : 0.903);
        const torsoW = (gender === 'male' ? 0.26 : 0.21) * (h/1.7);
        const torsoDepth = torsoW * 0.5;

        const headBox = new THREE.Group(); headBox.position.y = eyeY;
        const head = new THREE.Mesh(new THREE.SphereGeometry(headH * 0.8, 16, 16), bodyMat);
        head.position.y = (h - headH * 0.5) - eyeY; headBox.add(head);
        [-1, 1].forEach(side => {
            const eye = new THREE.Mesh(new THREE.SphereGeometry(headH * 0.12, 12, 12), eyeMat);
            eye.position.set(side * (headH * 0.28), 0, (headH * 0.7)); headBox.add(eye);
        });
        group.add(headBox);
        group.headParts = headBox;

        const neck = new THREE.Mesh(new THREE.CylinderGeometry(headH*0.3, headH*0.3, neckH, 16), bodyMat);
        neck.position.y = h - headH - (neckH * 0.5); group.add(neck);

        const torso = new THREE.Mesh(new THREE.BoxGeometry(torsoW, torsoH, torsoDepth), bodyMat);
        torso.position.y = legH + (torsoH * 0.5); group.add(torso);

        group.arms = [];
        [-1, 1].forEach((side) => {
            const anchor = new THREE.Group();
            anchor.position.set(side * (torsoW * 0.6), legH + torsoH - (torsoW*0.15), 0);
            const armLen = h * 0.38;
            const mesh = new THREE.Mesh(new THREE.BoxGeometry(torsoW*0.3, armLen, torsoW*0.3), bodyMat);
            mesh.position.y = -armLen * 0.5; anchor.add(mesh); group.add(anchor); group.arms.push(anchor);
        });

        group.legs = [];
        [-1, 1].forEach(side => {
            const anchor = new THREE.Group(); anchor.position.set(side * (torsoW * 0.25), legH, 0);
            const mesh = new THREE.Mesh(new THREE.BoxGeometry(torsoW*0.4, legH, torsoW*0.4), bodyMat);
            mesh.position.y = -legH * 0.5; anchor.add(mesh); group.add(anchor); group.legs.push(anchor);
        });

        const canvas = document.createElement('canvas'); canvas.width = 512; canvas.height = 128;
        const ctx = canvas.getContext('2d'); ctx.font = "bold 45px sans-serif"; ctx.fillStyle = "#333"; ctx.textAlign = "center";
        const displayName = name || (role === 'B' ? 'B' : 'A');
        ctx.fillText(`${displayName} (${heightCm.toFixed(1)}cm)`, 256, 64);
        const spriteMaterial = new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(canvas) });
        const sprite = new THREE.Sprite(spriteMaterial);
        sprite.scale.set(1.5, 0.38, 1); 
        sprite.position.y = h + 0.3; 
        group.add(sprite);
        group.nameTag = sprite;

        group.userData = { height: h, eyeY: eyeY, role: role, depth: torsoDepth, width: torsoW, armLen: h*0.38 };

        return group;
    }

    function updateScene() {
        const hA = parseFloat(document.getElementById('heightA').value)||158, hB = parseFloat(document.getElementById('heightB').value)||171.5;
        const isRight = (currentArmType === 'right');
        
        const bookX = isRight ? 0.15 : -0.15;
        targetTargetPos.set(bookX, TOP_SHELF_HEIGHT, -0.15);

        if(personA) walkGroup.remove(personA); if(personB) walkGroup.remove(personB);
        
        personA = createMannequin(document.getElementById('colorA').value, hA, document.getElementById('genderA').value, document.getElementById('nameA').value, 'A');
        personB = createMannequin(document.getElementById('colorB').value, hB, document.getElementById('genderB').value, document.getElementById('nameB').value, 'B');
        
        const posAX = isRight ? -0.15 : 0.15;
        personA.position.set(posAX, 0, 0.12);

        const posBX = isRight ? 0.15 : -0.15;
        personB.position.set(posBX, 0, 0.28);
        personB.rotation.y = 0;

        const activeArmIndex = isRight ? 1 : 0;
        const otherArmIndex = isRight ? 0 : 1;

        const shoulderY_B = personB.position.y + (hB * 0.01 * 0.82);
        const armLen_B = personB.userData.armLen;
        const dy_B = TOP_SHELF_HEIGHT - shoulderY_B;
        
        let armAngle_B = Math.asin(Math.max(-1, Math.min(1, dy_B / armLen_B))) + Math.PI / 2;
        if (isNaN(armAngle_B) || shoulderY_B + armLen_B < TOP_SHELF_HEIGHT) {
            armAngle_B = Math.PI * 0.95;
        }

        const shoulderY_A = personA.position.y + (hA * 0.01 * 0.82);
        const armLen_A = personA.userData.armLen;
        const dy_A = TOP_SHELF_HEIGHT - shoulderY_A;
        let armAngle_A = Math.asin(Math.max(-1, Math.min(1, dy_A / armLen_A))) + Math.PI / 2;
        if (isNaN(armAngle_A)) armAngle_A = Math.PI * 0.92;

        personA.arms[activeArmIndex].rotation.set(Math.min(armAngle_A, Math.PI * 0.92), 0, isRight ? -0.15 : 0.15);
        personA.arms[otherArmIndex].rotation.set(0, 0, 0);

        personB.arms[activeArmIndex].rotation.set(armAngle_B, 0, isRight ? -0.15 : 0.15);
        personB.arms[otherArmIndex].rotation.set(0, 0, 0);

        walkGroup.add(personA, personB);

        walkGroup.updateMatrixWorld(true);
        personA.headParts.lookAt(targetTargetPos);
        personB.headParts.lookAt(targetTargetPos);

        const nA = document.getElementById('nameA').value||'A', nB = document.getElementById('nameB').value||'B';
        if(currentView !== '3rd') {
            const myName = (currentView === 'A') ? nA : nB;
            document.getElementById('view-label').innerText = `${myName} 的视角`;
            if(currentView === 'A') { personA.headParts.visible = false; personA.nameTag.visible = false; }
            if(currentView === 'B') { personB.headParts.visible = false; personB.nameTag.visible = false; }
        }

        document.getElementById('info').innerHTML = `
            <div class="info-row"><span class="info-label">📏 身高差</span><span class="info-value">${Math.abs(hA-hB).toFixed(1)}<span class="unit">cm</span></span></div>
            <div class="info-row"><span class="info-label">📚 最上层高度</span><span class="info-value">${(TOP_SHELF_HEIGHT * 100).toFixed(0)}<span class="unit">cm</span></span></div>
        `;
    }

    function animate() {
        requestAnimationFrame(animate);
        
        const centerPos = new THREE.Vector3(0, personA.userData.height * 0.8, 0.15);

        if (currentView === '3rd') {
            camera.up.set(0, 1, 0);
            camera.position.set(
                centerPos.x + Math.sin(rotation.y) * camDist, 
                centerPos.y + Math.sin(rotation.x) * camDist, 
                centerPos.z + Math.cos(rotation.y) * camDist
            );
            camera.lookAt(centerPos);
        } else {
            const self = (currentView === 'A' ? personA : personB);
            camera.up.set(0, 1, 0);

            const eyePos = new THREE.Vector3(0, self.userData.eyeY, 0.02);
            eyePos.applyQuaternion(self.quaternion);
            camera.position.copy(self.position).add(eyePos);
            
            const lookDist = 5;
            const dir = new THREE.Vector3(0, 0, -1);
            
            const euler = new THREE.Euler(rotation.x, rotation.y, 0, 'YXZ');
            dir.applyEuler(euler);
            dir.multiplyScalar(lookDist);
            
            camera.lookAt(camera.position.clone().add(dir));
        }
        renderer.render(scene, camera);
    }

    function setupControls() {
        const c = document.getElementById('canvas-container');
        const move = (dx, dy) => {
            rotation.y -= dx * 0.005; 
            rotation.x -= dy * 0.005;
            
            if (currentView === '3rd') {
                rotation.x = Math.max(-Math.PI/2.1, Math.min(Math.PI/2.1, rotation.x));
            } else {
                rotation.x = Math.max(-Math.PI * 0.49, Math.min(Math.PI * 0.49, rotation.x));
            }
        };

        let initialPinchDist = null;

        c.addEventListener('mousedown', () => isDragging = true);
        window.addEventListener('mouseup', () => isDragging = false);
        window.addEventListener('mousemove', e => { if(isDragging) move(e.movementX, e.movementY); });

        c.addEventListener('wheel', e => {
            if (currentView === '3rd') {
                camDist += e.deltaY * 0.002;
                camDist = Math.max(0.5, Math.min(10, camDist));
            }
        }, { passive: true });

        c.addEventListener('touchstart', e => {
            isDragging = true;
            if (e.touches.length === 1) {
                previousTouch = e.touches[0];
                initialPinchDist = null;
            } else if (e.touches.length === 2 && currentView === '3rd') {
                initialPinchDist = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
            }
        }, { passive: false });

        window.addEventListener('touchend', e => { 
            if (e.touches.length < 2) initialPinchDist = null;
            if (e.touches.length === 0) isDragging = false; 
        });

        window.addEventListener('touchmove', e => {
            if(!isDragging) return;
            
            if (e.touches.length === 1 && previousTouch) {
                if (e.cancelable) e.preventDefault(); 
                const touch = e.touches[0];
                move(touch.clientX - previousTouch.clientX, touch.clientY - previousTouch.clientY);
                previousTouch = touch;
            } else if (e.touches.length === 2 && initialPinchDist !== null && currentView === '3rd') {
                if (e.cancelable) e.preventDefault();
                const currentDist = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
                const diff = currentDist - initialPinchDist;
                camDist -= diff * 0.005;
                camDist = Math.max(0.5, Math.min(10, camDist));
                initialPinchDist = currentDist;
            }
        }, { passive: false });
    }

    function switchView() {
        const order = ['3rd', 'A', 'B']; 
        currentView = order[(order.indexOf(currentView) + 1) % 3];
        const nA = document.getElementById('nameA').value||'A', nB = document.getElementById('nameB').value||'B';
        
        if (currentView === '3rd') {
            document.getElementById('view-label').innerText = '第三人称视角';
        } else {
            const myName = (currentView === 'A') ? nA : nB;
            document.getElementById('view-label').innerText = `${myName} 的视角`;
        }
        
        document.getElementById('crosshair').style.display = currentView === '3rd' ? 'none' : 'block';
        
        personA.headParts.visible = true; personA.nameTag.visible = true;
        personB.headParts.visible = true; personB.nameTag.visible = true;
        
        if (currentView === 'A') {
            personA.headParts.visible = false;
            personA.nameTag.visible = false;
        } else if (currentView === 'B') {
            personB.headParts.visible = false;
            personB.nameTag.visible = false;
        }
    }

    function shareToX() {
        const nA = document.getElementById('nameA').value || 'A';
        const nB = document.getElementById('nameB').value || 'B';
        const hA = parseFloat(document.getElementById('heightA').value) || 158.0;
        const hB = parseFloat(document.getElementById('heightB').value) || 171.5;
        const text = `${nB}(${hB.toFixed(1)}cm)帮${nA}(${hA.toFixed(1)}cm)拿了书！\n#书架模拟器\n`;
        window.open(`https://twitter.com/intent/tweet?text=${encodeURIComponent(text)}&url=${encodeURIComponent(window.location.href)}`, '_blank');
    }

    // 入力フォームからフォーカスが外れた際に、パネルのスクロール位置を上部へリセットする
    document.querySelectorAll('#ui-panel input, #ui-panel select').forEach(element => {
        element.addEventListener('blur', () => {
            const panel = document.getElementById('ui-panel');
            if (panel) {
                panel.scrollTop = 0;
            }
            // iOS Safari等の画面全体のズレ防止策
            window.scrollTo(0, 0);
        });
    });

    init();
</script>
</body>
</html>
